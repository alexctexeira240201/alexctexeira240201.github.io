<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrada | ALEXCTEXEIRA</title>
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>

  <header class="site-header" style="padding-bottom: 12px;">
    <nav class="top-nav">
      <a href="index.html">← VOLVER AL INICIO</a>
    </nav>
  </header>

  <main class="post-wrapper">
    <div id="post-date" class="post-date"></div>
    <h1 id="post-title" class="post-title">Cargando archivo...</h1>

    <!-- CARRUSEL DE PORTADA -->
    <div id="post-carousel" class="post-carousel" style="display: none;">
      <img id="post-cover" class="post-cover" alt="" />
      <button id="cover-prev" class="post-carousel-btn prev" style="display:none;" aria-label="Anterior">‹</button>
      <button id="cover-next" class="post-carousel-btn next" style="display:none;" aria-label="Siguiente">›</button>
      <div id="cover-dots" class="post-carousel-dots"></div>
    </div>

    <article id="post-content" class="post-content"></article>
  </main>

  <footer class="site-footer">
    <p>© Alex C. Texeira</p>
    <p>México - contacto@alexctexeira.com.mx</p>
  </footer>

  <script type="module">
    import { db } from "./firebase-config.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderContentWithImages(rawText, inlineImages) {
      const safe = escapeHtml(rawText || "");
      return safe.replace(/\[IMG:(\d+)\]/g, (match, num) => {
        const idx = parseInt(num, 10) - 1;
        if (inlineImages && inlineImages[idx]) {
          return `<img src="${inlineImages[idx]}" class="post-inline-img" alt="Imagen ${num}" loading="lazy" />`;
        }
        return "";
      });
    }

    async function loadPost() {
      if (!id) {
        document.getElementById("post-title").textContent = "Archivo no encontrado";
        return;
      }

      const snap = await getDoc(doc(db, "posts", id));
      if (!snap.exists()) {
        document.getElementById("post-title").textContent = "Este archivo ya no existe";
        return;
      }

      const data = snap.data();
      document.title = `${data.title} | ALEXCTEXEIRA`;
      document.getElementById("post-title").textContent = data.title;
      document.getElementById("post-content").innerHTML = renderContentWithImages(data.content, data.inlineImages || []);

      if (data.createdAt?.toDate) {
        document.getElementById("post-date").textContent = data.createdAt.toDate().toLocaleDateString("es-MX", {
          year: "numeric", month: "long", day: "numeric"
        });
      }

      // Portada: soporta arreglo `images` o el campo anterior `image`
      const covers = (Array.isArray(data.images) && data.images.length > 0)
        ? data.images
        : (data.image ? [data.image] : []);

      if (covers.length > 0) {
        const carousel = document.getElementById("post-carousel");
        const imgEl = document.getElementById("post-cover");
        const prevBtn = document.getElementById("cover-prev");
        const nextBtn = document.getElementById("cover-next");
        const dotsEl = document.getElementById("cover-dots");

        carousel.style.display = "block";
        let current = 0;

        function showCover(idx) {
          current = (idx + covers.length) % covers.length;
          imgEl.src = covers[current];
          imgEl.alt = `${data.title} (${current + 1}/${covers.length})`;
          if (covers.length > 1) {
            dotsEl.innerHTML = covers.map((_, i) =>
              `<button class="carousel-dot ${i === current ? 'active' : ''}" aria-label="Imagen ${i + 1}"></button>`
            ).join("");
            dotsEl.querySelectorAll(".carousel-dot").forEach((b, i) => {
              b.addEventListener("click", () => showCover(i));
            });
          }
        }

        if (covers.length > 1) {
          prevBtn.style.display = "flex";
          nextBtn.style.display = "flex";
          prevBtn.addEventListener("click", () => showCover(current - 1));
          nextBtn.addEventListener("click", () => showCover(current + 1));
        }

        showCover(0);
      }
    }

    loadPost();
  </script>
</body>
</html>
