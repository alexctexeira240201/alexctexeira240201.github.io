media:
  input: img
  output: img
  extensions: [jpg, jpeg, png, gif, webp, svg]

content:
  - name: datos
    label: Editar Mi Sitio Web
    path: datos.json
    type: file
    fields:
      - name: inicio
        label: Página de Inicio
        type: object
        fields:
          - { name: tituloPrincipal, label: Título Grande, type: string }
          - { name: subtitulo, label: Subtítulo, type: string }
          - { name: imagenHero, label: Imagen Principal (Banner), type: image }
          - { name: textoHero, label: Texto si no hay imagen, type: text }
      - name: musaMedia
        label: Imágenes del Micrositio MUSA
        type: object
        fields:
          - { name: logo, label: Logotipo de MUSA (Manos), type: image }
          - { name: portada, label: Foto Portada MUSA, type: image }
          - { name: fotoQuienes, label: Foto ¿Quiénes somos?, type: image }
          - { name: fotoEnfermeria, label: Foto Equipo Enfermería, type: image }
          - { name: fotoEje1, label: Foto Eje 1 (Intervenciones Creativas), type: image }
          - { name: fotoEje2, label: Foto Eje 2 (Educación para la Salud), type: image }
          - { name: fotoEje3, label: Foto Eje 3 (Brigadas de Arteterapia), type: image }
      - name: blog
        label: Entradas del Blog y Proyectos
        type: object
        list: true
        fields:
          - { name: titulo, label: Título de la Publicación, type: string }
          - { name: fecha, label: Fecha, type: string }
          - name: tags
            label: Etiquetas (Tags)
            type: select
            options:
              multiple: true
              creatable: true
              values:
                - MUSA
                - HEPL
                - ARTÍCULO
                - POST
                - DESTACADO
          - { name: imagen, label: Imagen de Portada, type: image }
          - { name: resumen, label: Info Rápida (Carrusel y Tarjeta), type: text }
          - { name: contenido, label: Contenido Completo, type: rich-text }
      - name: proyectos
        label: Carrusel de Proyectos en Inicio
        type: object
        list: true
        fields:
          - { name: nombre, label: Nombre del Proyecto, type: string }
          - { name: etiqueta, label: Subtítulo / Institución, type: string }
          - { name: imagen, label: Imagen del Proyecto, type: image }
          - { name: resumen, label: Info Rápida del Proyecto, type: text }
          - { name: enlace, label: Enlace (ej. musa.html o hepl.html), type: string }
      - name: sobreMi
        label: Editar Sobre Mí / Trayectoria
        type: object
        fields:
          - { name: nombre, label: Nombre Completo, type: string }
          - { name: rol, label: Título / Subtítulo Profesional, type: string }
          - { name: enlaceDriveCV, label: Enlace de Google Drive para descargar CV, type: string }
          - { name: fotoPerfil, label: Mi Foto (Perfil), type: image }
          - { name: biografia, label: Texto Sobre Mí, type: text }
          - { name: fotoProyectos, label: Imagen Liderazgo y Proyectos, type: image }
          - name: formacion
            label: Formación Académica (3 Tarjetas)
            type: object
            list: true
            fields:
              - { name: etiqueta, label: Etiqueta (ej. En curso), type: string }
              - { name: titulo, label: Carrera / Estudio, type: string }
              - { name: institucion, label: Universidad / Institución, type: string }
              - { name: detalle, label: Descripción breve, type: text }
          - name: liderazgo
            label: Liderazgo y Proyectos
            type: object
            list: true
            fields:
              - { name: titulo, label: Rol / Proyecto, type: string }
              - { name: descripcion, label: Descripción, type: text }
          - name: experiencia
            label: Experiencia Clínica y Laboral
            type: object
            list: true
            fields:
              - { name: puesto, label: Puesto o Rotación, type: string }
              - { name: lugar, label: Hospital o Empresa, type: string }
              - { name: detalle, label: Actividades clave, type: text }
          - name: certificaciones
            label: Certificaciones (Cápsulas)
            type: object
            list: true
            fields:
              - { name: nombre, label: Certificación, type: string }
              - { name: emisor, label: Institución y Año, type: string }
          - name: herramientas
            label: Herramientas (Palabras Flotantes)
            type: object
            list: true
            fields:
              - { name: palabra, label: Palabra Clave Flotante, type: string }
              - { name: detalle, label: Explicación al hacer clic, type: text }
