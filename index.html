<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alex Daniel Castillo Texeira</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-mint: #eefaf0;
      --blue-btn: #4a90d9;
      --blue-card: #d9eafd;
      --lilac-card: #ece3fc;
      --pink-card: #fce4ec;
      --text-dark: #0f172a;
      --text-muted: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-mint);
      color: var(--text-dark);
      line-height: 1.6;
    }

    /* Navegación superior */
    .main-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
      padding: 1.35rem 1rem;
      flex-wrap: wrap;
    }
    .nav-btn {
      border: none;
      background-color: #ffffff;
      color: var(--text-dark);
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 0.82rem;
      text-transform: uppercase;
      padding: 0.7rem 1.55rem;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
      transition: transform 0.15s, background-color 0.2s;
      text-decoration: none;
      display: inline-block;
    }
    .nav-btn:hover { transform: translateY(-2px); }
    .nav-btn.active {
      background-color: var(--blue-btn);
      color: #ffffff;
    }

    .container {
      max-width: 960px;
      margin: 0 auto 3.5rem;
      padding: 0 1.25rem;
    }

    .view-section { display: none; }
    .view-section.active { display: block; }

    /* Hero */
    .hero-box {
      text-align: center;
      padding: 1.75rem 1rem 2.5rem;
    }
    .hero-box h1 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: clamp(2rem, 5vw, 3.1rem);
      line-height: 1.15;
      margin-bottom: 0.65rem;
    }
    .hero-box p {
      font-size: 1.05rem;
      color: var(--text-muted);
      max-width: 680px;
      margin: 0 auto 1.5rem;
    }
    .hero-banner {
      width: 100%;
      max-height: 360px;
      object-fit: cover;
      border-radius: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    /* Secciones de Inicio */
    .section-heading {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 1.45rem;
      margin: 2rem 0 1.1rem;
      color: var(--text-dark);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(275px, 1fr));
      gap: 1.25rem;
    }

    .project-card, .post-preview {
      background: #ffffff;
      border-radius: 22px;
      padding: 1.5rem;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .project-card:nth-child(3n+1) { background-color: var(--blue-card); }
    .project-card:nth-child(3n+2) { background-color: var(--lilac-card); }
    .project-card:nth-child(3n+3) { background-color: var(--pink-card); }

    .card-img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 1rem;
    }
    .card-kicker {
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--blue-btn);
      margin-bottom: 0.3rem;
    }
    .project-card h3, .post-preview h3 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 1.15rem;
      margin-bottom: 0.45rem;
    }
    .project-card p, .post-preview p {
      font-size: 0.93rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .btn-pill-action {
      display: inline-block;
      align-self: flex-start;
      background-color: var(--text-dark);
      color: #ffffff;
      text-decoration: none;
      border: none;
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 0.78rem;
      text-transform: uppercase;
      padding: 0.65rem 1.25rem;
      border-radius: 999px;
      cursor: pointer;
    }

    /* Blog completo */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .tag-btn {
      border: none;
      background: #ffffff;
      padding: 0.45rem 1rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .tag-btn.active {
      background: var(--blue-btn);
      color: #ffffff;
    }
    .tag-pill {
      display: inline-block;
      background: var(--bg-mint);
      color: var(--text-dark);
      font-size: 0.72rem;
      font-weight: 800;
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
      margin-right: 0.35rem;
      text-transform: uppercase;
    }

    .single-article {
      background: #ffffff;
      border-radius: 24px;
      padding: 2rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }
    .single-article img {
      width: 100%;
      max-height: 380px;
      object-fit: cover;
      border-radius: 16px;
      margin: 1rem 0 1.25rem;
    }
    .article-body {
      font-size: 1rem;
      line-height: 1.8;
    }
    .article-body p { margin-bottom: 1rem; }

    footer {
      text-align: center;
      padding: 1.75rem 1rem;
      font-size: 0.86rem;
      color: var(--text-muted);
    }
  </style>
</head>

      <div class="cards-grid" id="projects-grid"></div>

      <h2 class="section-heading">Publicaciones Recientes</h2>
      <div class="cards-grid" id="home-posts-grid"></div>
    </section>
