<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alex Daniel Castillo Texeira</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-mint: #eefaf0;
      --blue-btn: #4a90d9;
      --blue-card: #d9eafd;
      --lilac-card: #ece3fc;
      --pink-card: #fce4ec;
      --text-dark: #0f172a;
      --text-muted: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-mint);
      color: var(--text-dark);
      line-height: 1.6;
    }

    /* Navegación superior */
    .main-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
      padding: 1.35rem 1rem;
      flex-wrap: wrap;
    }
    .nav-btn {
      border: none;
      background-color: #ffffff;
      color: var(--text-dark);
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 0.82rem;
      text-transform: uppercase;
      padding: 0.7rem 1.55rem;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
      transition: transform 0.15s, background-color 0.2s;
      text-decoration: none;
      display: inline-block;
    }
    .nav-btn:hover { transform: translateY(-2px); }
    .nav-btn.active {
      background-color: var(--blue-btn);
      color: #ffffff;
    }

    .container {
      max-width: 960px;
      margin: 0 auto 3.5rem;
      padding: 0 1.25rem;
    }

    .view-section { display: none; }
    .view-section.active { display: block; }

    /* Hero */
    .hero-box {
      text-align: center;
      padding: 1.75rem 1rem 2.5rem;
    }
    .hero-box h1 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: clamp(2rem, 5vw, 3.1rem);
      line-height: 1.15;
      margin-bottom: 0.65rem;
    }
    .hero-box p {
      font-size: 1.05rem;
      color: var(--text-muted);
      max-width: 680px;
      margin: 0 auto 1.5rem;
    }
    .hero-banner {
      width: 100%;
      max-height: 360px;
      object-fit: cover;
      border-radius: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    /* Secciones de Inicio */
    .section-heading {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 1.45rem;
      margin: 2rem 0 1.1rem;
      color: var(--text-dark);
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(275px, 1fr));
      gap: 1.25rem;
    }

    .project-card, .post-preview {
      background: #ffffff;
      border-radius: 22px;
      padding: 1.5rem;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .project-card:nth-child(3n+1) { background-color: var(--blue-card); }
    .project-card:nth-child(3n+2) { background-color: var(--lilac-card); }
    .project-card:nth-child(3n+3) { background-color: var(--pink-card); }

    .card-img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 1rem;
    }
    .card-kicker {
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--blue-btn);
      margin-bottom: 0.3rem;
    }
    .project-card h3, .post-preview h3 {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 1.15rem;
      margin-bottom: 0.45rem;
    }
    .project-card p, .post-preview p {
      font-size: 0.93rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .btn-pill-action {
      display: inline-block;
      align-self: flex-start;
      background-color: var(--text-dark);
      color: #ffffff;
      text-decoration: none;
      border: none;
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 0.78rem;
      text-transform: uppercase;
      padding: 0.65rem 1.25rem;
      border-radius: 999px;
      cursor: pointer;
    }

    /* Blog completo */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .tag-btn {
      border: none;
      background: #ffffff;
      padding: 0.45rem 1rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .tag-btn.active {
      background: var(--blue-btn);
      color: #ffffff;
    }
    .tag-pill {
      display: inline-block;
      background: var(--bg-mint);
      color: var(--text-dark);
      font-size: 0.72rem;
      font-weight: 800;
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
      margin-right: 0.35rem;
      text-transform: uppercase;
    }

    .single-article {
      background: #ffffff;
      border-radius: 24px;
      padding: 2rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }
    .single-article img {
      width: 100%;
      max-height: 380px;
      object-fit: cover;
      border-radius: 16px;
      margin: 1rem 0 1.25rem;
    }
    .article-body {
      font-size: 1rem;
      line-height: 1.8;
    }
    .article-body p { margin-bottom: 1rem; }

    footer {
      text-align: center;
      padding: 1.75rem 1rem;
      font-size: 0.86rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <nav class="main-nav">
    <button class="nav-btn active" onclick="showView('inicio', this)">Inicio</button>
    <button class="nav-btn" onclick="showView('blog', this)">Blog</button>
    <a href="sobre-mi.html" class="nav-btn">Sobre Mí</a>
  </nav>

  <main class="container">
    <!-- VISTA INICIO -->
    <section id="view-inicio" class="view-section active">
      <div class="hero-box">
        <h1 id="hero-title">Alex Daniel Castillo Texeira</h1>
        <p id="hero-subtitle">Enfermería · Promoción y Educación para la Salud · Gestión y Proyectos</p>
        <img id="hero-img" class="hero-banner" style="display:none;" alt="Portada" />
        <p id="hero-fallback" style="display:none;"></p>
      </div>

      <h2 class="section-heading">Proyectos y Micrositios</h2>
      <div class="cards-grid" id="projects-grid"></div>

      <h2 class="section-heading">Publicaciones Recientes</h2>
      <div class="cards-grid" id="home-posts-grid"></div>
    </section>

    <!-- VISTA BLOG -->
    <section id="view-blog" class="view-section">
      <div id="blog-list-wrap">
        <h2 class="section-heading" style="margin-top:0.5rem;">Blog y Bitácora</h2>
        <div class="filter-bar" id="tag-filters"></div>
        <div class="cards-grid" id="blog-posts-grid"></div>
      </div>

      <div id="blog-reader-wrap" class="single-article" style="display:none;">
        <button class="btn-pill-action" onclick="closeArticle()" style="margin-bottom:1.25rem;">← Volver al Blog</button>
        <div id="reader-tags" style="margin-bottom:0.5rem;"></div>
        <div id="reader-date" style="font-size:0.84rem; font-weight:700; color:var(--blue-btn); margin-bottom:0.35rem;"></div>
        <h2 id="reader-title" style="font-family:'Montserrat',sans-serif; font-weight:900; font-size:1.65rem;"></h2>
        <img id="reader-img" style="display:none;" alt="Portada artículo" />
        <div id="reader-body" class="article-body"></div>
      </div>
    </section>
  </main>

  <footer>
    <p>Alex Daniel Castillo Texeira · León, Guanajuato, México</p>
  </footer>

  <script>
    let allPosts = [];
    let currentTag = 'TODOS';

    const defaultProyectos = [
      {
        nombre: "MUSA · Arteterapia en Enfermería",
        etiqueta: "Grupo Estudiantil · Universidad La Salle Bajío",
        resumen: "Promoción y educación en salud a través de la arteterapia como intervención de enfermería.",
        enlace: "musa.html"
      },
      {
        nombre: "Manual de Integración Clínica HEPL",
        etiqueta: "Hospital de Especialidades Pediátrico León",
        resumen: "Guía operativa, de bioseguridad y calculadora pediátrica para estudiantes de enfermería.",
        enlace: "hepl.html"
      }
    ];

    function showView(viewName, btn) {
      document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('view-' + viewName).classList.add('active');
      if (btn) btn.classList.add('active');
      if (viewName === 'blog') closeArticle();
    }

    async function loadSiteData() {
      let projs = defaultProyectos;
      try {
        const res = await fetch('datos.json?v=' + Date.now());
        if (res.ok) {
          const data = await res.json();
          if (data.inicio) {
            if (data.inicio.tituloPrincipal) document.getElementById('hero-title').textContent = data.inicio.tituloPrincipal;
            if (data.inicio.subtitulo) document.getElementById('hero-subtitle').textContent = data.inicio.subtitulo;
            if (data.inicio.imagenHero) {
              const img = document.getElementById('hero-img');
              img.src = data.inicio.imagenHero;
              img.style.display = 'block';
            } else if (data.inicio.textoHero) {
              const fb = document.getElementById('hero-fallback');
              fb.textContent = data.inicio.textoHero;
              fb.style.display = 'block';
            }
          }
          if (Array.isArray(data.proyectos) && data.proyectos.length > 0) {
            projs = data.proyectos;
          }
          allPosts = Array.isArray(data.blog) ? data.blog : [];
        }
      } catch (e) {
        console.warn('Usando datos de respaldo en inicio:', e);
      }

      document.getElementById('projects-grid').innerHTML = projs.map(p => `
        <article class="project-card">
          <div>
            ${p.imagen ? `<img src="${p.imagen}" class="card-img" alt="${p.nombre}">` : ''}
            <div class="card-kicker">${p.etiqueta || 'Proyecto'}</div>
            <h3>${p.nombre}</h3>
            <p>${p.resumen || ''}</p>
          </div>
          <a href="${p.enlace || '#'}" class="btn-pill-action">Explorar</a>
        </article>
      `).join('');

      renderHomePosts();
      renderTagFilters();
      renderBlogPosts('TODOS');
    }

    function renderHomePosts() {
      const grid = document.getElementById('home-posts-grid');
      if (allPosts.length === 0) {
        grid.innerHTML = `<article class="post-preview"><p>Explora la pestaña <strong>Blog</strong> para ver las entradas publicadas.</p></article>`;
        return;
      }
      const recent = allPosts.slice(0, 3);
      grid.innerHTML = recent.map((p, idx) => `
        <article class="post-preview">
          <div>
            ${p.imagen ? `<img src="${p.imagen}" class="card-img" alt="${p.titulo}">` : ''}
            <div class="card-kicker">${p.fecha || ''}</div>
            <h3>${p.titulo}</h3>
            <p>${p.resumen || ''}</p>
          </div>
          <button class="btn-pill-action" onclick="openArticleFromHome(${idx})">Leer más</button>
        </article>
      `).join('');
    }

    function renderTagFilters() {
      const tagSet = new Set(['TODOS']);
      allPosts.forEach(p => {
        if (Array.isArray(p.tags)) {
          p.tags.forEach(t => tagSet.add(t.trim().toUpperCase()));
        }
      });

      document.getElementById('tag-filters').innerHTML = Array.from(tagSet).map(t => `
        <button class="tag-btn ${t === currentTag ? 'active' : ''}" onclick="filterByTag('${t}', this)">${t}</button>
      `).join('');
    }

    function filterByTag(tag, btn) {
      currentTag = tag;
      document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderBlogPosts(tag);
    }

    function renderBlogPosts(tag) {
      const filtered = tag === 'TODOS'
        ? allPosts
        : allPosts.filter(p => Array.isArray(p.tags) && p.tags.map(x => x.trim().toUpperCase()).includes(tag));

      const grid = document.getElementById('blog-posts-grid');
      if (filtered.length === 0) {
        grid.innerHTML = `<article class="post-preview"><p>No hay publicaciones disponibles en este momento.</p></article>`;
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const realIdx = allPosts.indexOf(p);
        return `
          <article class="post-preview">
            <div>
              ${p.imagen ? `<img src="${p.imagen}" class="card-img" alt="${p.titulo}">` : ''}
              <div style="margin-bottom:0.45rem;">${(p.tags || []).map(t => `<span class="tag-pill">${t}</span>`).join('')}</div>
              <div class="card-kicker">${p.fecha || ''}</div>
              <h3>${p.titulo}</h3>
              <p>${p.resumen || ''}</p>
            </div>
            <button class="btn-pill-action" onclick="openArticle(${realIdx})">Leer artículo</button>
          </article>
        `;
      }).join('');
    }

    function openArticleFromHome(idx) {
      const blogBtn = document.querySelectorAll('.nav-btn')[1];
      showView('blog', blogBtn);
      openArticle(idx);
    }

    function openArticle(idx) {
      const p = allPosts[idx];
      if (!p) return;
      document.getElementById('blog-list-wrap').style.display = 'none';
      document.getElementById('reader-tags').innerHTML = (p.tags || []).map(t => `<span class="tag-pill">${t}</span>`).join('');
      document.getElementById('reader-date').textContent = p.fecha || '';
      document.getElementById('reader-title').textContent = p.titulo;
      const img = document.getElementById('reader-img');
      if (p.imagen) {
        img.src = p.imagen;
        img.style.display = 'block';
      } else {
        img.style.display = 'none';
      }
      document.getElementById('reader-body').innerHTML = marked.parse(p.contenido || '');
      document.getElementById('blog-reader-wrap').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closeArticle() {
      document.getElementById('blog-reader-wrap').style.display = 'none';
      document.getElementById('blog-list-wrap').style.display = 'block';
    }

    (function checkInitialView() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('vista') === 'blog') {
        const blogBtn = document.querySelectorAll('.nav-btn')[1];
        if (blogBtn) showView('blog', blogBtn);
      }
    })();

    loadSiteData();
  </script>
</body>
</html>
