<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADMIN // ALEXCTEXEIRA</title>
  <link rel="stylesheet" href="style.css?v=2" />
  <style>
    .admin-wrap { max-width: 860px; margin: 40px auto; padding: 0 20px 80px; }
    .card { background: #111; border: 1px solid #2c3b1e; border-radius: 14px; padding: 24px; margin-bottom: 28px; }
    .card h2 { font-size: 1.3rem; color: var(--olive-text); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }
    label { display: block; font-family: var(--font-mono); font-size: 0.82rem; color: #bbb; margin: 12px 0 6px; }
    input, textarea { width: 100%; background: #070707; border: 1px solid #333; color: #fff; padding: 10px 12px; border-radius: 8px; font-family: var(--font-display); font-size: 0.95rem; }
    textarea { min-height: 130px; resize: vertical; font-family: var(--font-mono); font-size: 0.86rem; }
    button { background: var(--olive-mid); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 14px; }
    button:hover { background: #617d44; }
    .btn-edit { background: #2c4c7c; padding: 6px 12px; font-size: 0.8rem; margin-top: 0; }
    .btn-edit:hover { background: #3b639e; }
    .btn-cancel { background: #444; margin-left: 8px; }
    .btn-cancel:hover { background: #666; }
    .btn-danger { background: #7a2222; padding: 6px 12px; font-size: 0.8rem; margin-top: 0; }
    .btn-danger:hover { background: #a12c2c; }
    .btn-inline { background: #223514; border: 1px solid #4e6536; padding: 7px 14px; font-size: 0.8rem; margin: 6px 0 8px; font-family: var(--font-mono); }
    .item-list { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
    .item-row { display: flex; justify-content: space-between; align-items: center; background: #191919; padding: 10px 14px; border-radius: 8px; gap: 12px; flex-wrap: wrap; }
    .item-row span { font-size: 0.9rem; }
    .item-actions { display: flex; gap: 8px; }
    .thumbs-strip { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    .thumb-item { position: relative; width: 96px; height: 72px; border-radius: 8px; overflow: hidden; border: 1px solid #444; }
    .thumb-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb-del { position: absolute; top: 3px; right: 3px; background: rgba(180,20,20,0.9); color: #fff; border: none; width: 20px; height: 20px; border-radius: 50%; font-size: 0.72rem; cursor: pointer; margin: 0; padding: 0; line-height: 20px; }
    .thumb-badge { position: absolute; bottom: 2px; left: 2px; background: rgba(0,0,0,0.75); color: #fff; font-size: 0.65rem; padding: 1px 5px; border-radius: 4px; font-family: var(--font-mono); }
    .preview-img { max-height: 120px; border-radius: 8px; margin-top: 10px; display: none; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
    .admin-nav-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .admin-nav-tab { background: #181818; border: 1px solid #333; color: #ccc; padding: 8px 16px; border-radius: 8px; font-family: var(--font-mono); font-size: 0.82rem; cursor: pointer; margin-top: 0; }
    .admin-nav-tab.active { background: var(--olive-dark); border-color: #fce300; color: #fce300; }
    .admin-pane { display: none; }
    .admin-pane.active { display: block; }
    .msg { font-family: var(--font-mono); font-size: 0.85rem; color: #8be08b; margin-top: 10px; }
    .err { color: #ff6b6b; }
  </style>
</head>

  <script type="module">

    import { collection, addDoc, getDocs, deleteDoc, doc, setDoc, updateDoc, getDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // PESTAÑAS
    document.querySelectorAll(".admin-nav-tab").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".admin-nav-tab").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".admin-pane").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById("pane-" + btn.dataset.tab).classList.add("active");
      });
    });

    function compressImage(file, maxWidth = 900, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement("canvas");
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/webp", quality));
          };
          img.onerror = reject;
        };
        reader.onerror = reject;
      });
    }

    let postCoverImages = [];
    let postInlineImages = [];
    let projImageBase64 = "";
    let smFotoPerfil = "";
    let smFotoProyectos = "";
    let editingPostId = null;
    let editingProjId = null;
    let postsCache = {};
    let projsCache = {};

      fotoPerfil: "",

      fotoProyectos: "",
      formacion: [
        { etiqueta: "En curso", titulo: "Licenciatura en Enfermería", institucion: "Universidad La Salle Bajío · Campus Campestre", detalle: "Formación clínica hospitalaria y comunitaria, gestión de servicios de enfermería, cuidado crítico y tutoría académica entre pares." },
        { etiqueta: "Antecedente técnico", titulo: "Ingeniería Biomédica (6.º Semestre)", institucion: "Universidad La Salle Bajío", detalle: "Base analítica, instrumentación médica, fisiología cuantitativa y desarrollo de soluciones tecnológicas aplicadas al entorno clínico." }
      ],
      liderazgo: [
        { titulo: "Fundador y Líder de Relaciones Públicas · MUSA", descripcion: "Grupo estudiantil de Promoción y Educación en Salud a través de la Arteterapia como Intervención de Enfermería en la Universidad La Salle Bajío." },
        { titulo: "Secretario del Consejo Local Estudiantil", descripcion: "Escuela de Medicina del Bajío (2024–2025). Organización logística de la Jornada Académica de Salud e Innovación y el hackathon MEDITHON." },

        { puesto: "Rotaciones Clínicas Hospitalarias y Comunitarias", lugar: "Hospital General de León y Clínica Municipal Efraín Huerta", detalle: "Práctica supervisada en Medicina Interna, Urgencias, Cirugía, Quirófano, Recuperación, Traumatología y Ortopedia, y Unidad de Quemados." },
        { puesto: "Bilingual Customer & Provider Service Representative", lugar: "Teleperformance · Ambetter Health (2022–2024)", detalle: "Atención bilingüe (inglés-español) a asegurados y proveedores médicos en Estados Unidos." }
      ],

        { nombre: "Cambridge English B2", emisor: "CELEEX · UAGro (2018)" },
        { nombre: "Primeros Auxilios Psicológicos", emisor: "DisasterReady" },
        { nombre: "Primeros Auxilios", emisor: "Universidad La Salle Bajío (2023)" }
      ],
      herramientas: [
        { palabra: "Google Workspace & Apps Script", detalle: "Automatización de flujos administrativos, registros de asistencia y hojas de cálculo clínicas." },
        { palabra: "Canva Pro & Diseño Editorial", detalle: "Diseño de manuales hospitalarios, infografías clínicas y constancias institucionales." },
        { palabra: "Adobe Photoshop", detalle: "Edición fotográfica, montaje gráfico y preparación de recursos visuales." },
        { palabra: "Desarrollo Web (HTML/CSS/JS)", detalle: "Creación de micrositios institucionales, calculadoras clínicas interactivas y portafolios." },
        { palabra: "Idioma Inglés (B2)", detalle: "Comunicación fluida oral y escrita, terminología médica en inglés y docencia básica." },
        { palabra: "Idioma Portugués", detalle: "Nivel intermedio de comprensión y conversación." },

    };

    // IMÁGENES BLOG Y PROYECTOS
    function renderCoverPreviews() {
      const box = document.getElementById("post-covers-preview");
      box.innerHTML = postCoverImages.map((src, i) => `
        <div class="thumb-item">
          <img src="${src}" alt="Portada ${i + 1}" />
          <span class="thumb-badge">#${i + 1}${i === 0 ? " (Inicio)" : ""}</span>
          <button type="button" class="thumb-del" data-del-cover="${i}">×</button>
        </div>
      `).join("");
      box.querySelectorAll("[data-del-cover]").forEach(btn => {
        btn.addEventListener("click", () => {
          postCoverImages.splice(parseInt(btn.dataset.delCover, 10), 1);
          renderCoverPreviews();
        });
      });
    }

    function renderInlinePreviews() {
      const box = document.getElementById("post-inlines-preview");
      box.innerHTML = postInlineImages.map((src, i) => `
        <div class="thumb-item">
          <img src="${src}" alt="IMG ${i + 1}" />
          <span class="thumb-badge">[IMG:${i + 1}]</span>
        </div>
      `).join("");
    }

    document.getElementById("post-img-file").addEventListener("change", async (e) => {
      for (const file of Array.from(e.target.files || [])) {
        postCoverImages.push(await compressImage(file, 950, 0.72));
      }
      e.target.value = "";
      renderCoverPreviews();
    });

    document.getElementById("btn-insert-inline").addEventListener("click", () => {
      document.getElementById("post-inline-file").click();
    });

    document.getElementById("post-inline-file").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      postInlineImages.push(await compressImage(file, 850, 0.7));
      const tag = `\n[IMG:${postInlineImages.length}]\n`;
      const ta = document.getElementById("post-content");
      const start = ta.selectionStart ?? ta.value.length;
      const end = ta.selectionEnd ?? ta.value.length;
      ta.value = ta.value.slice(0, start) + tag + ta.value.slice(end);
      ta.focus();
      e.target.value = "";
      renderInlinePreviews();
    });

    document.getElementById("proj-img-file").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      projImageBase64 = await compressImage(file, 600, 0.78);
      const prev = document.getElementById("proj-img-preview");
      prev.src = projImageBase64;
      prev.style.display = "block";
    });

    document.getElementById("sm-foto-perfil-file").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      smFotoPerfil = await compressImage(file, 600, 0.75);
      const prev = document.getElementById("sm-foto-perfil-prev");
      prev.src = smFotoPerfil;
      prev.style.display = "block";
    });

    document.getElementById("sm-foto-proy-file").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      smFotoProyectos = await compressImage(file, 600, 0.75);
      const prev = document.getElementById("sm-foto-proy-prev");
      prev.src = smFotoProyectos;
      prev.style.display = "block";
    });

    // AUTH
    document.getElementById("btn-login").addEventListener("click", async () => {
      const email = document.getElementById("login-email").value.trim();
      const pass = document.getElementById("login-pass").value;
      const errEl = document.getElementById("login-error");
      errEl.textContent = "";
      if (email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
        errEl.textContent = "Acceso denegado: correo no autorizado.";
        return;
      }
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (err) {
        errEl.textContent = "Credenciales incorrectas.";
      }
    });

    document.getElementById("btn-logout").addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, async (user) => {
      if (user && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
        document.getElementById("login-box").style.display = "none";
        document.getElementById("admin-panel").style.display = "block";
        refreshAll();
      } else {
        if (user) await signOut(auth);
        document.getElementById("login-box").style.display = "block";
        document.getElementById("admin-panel").style.display = "none";
      }
    });

    // RESET FORMULARIOS
    function resetPostForm() {
      editingPostId = null;
      postCoverImages = [];
      postInlineImages = [];
      document.getElementById("blog-form-heading").textContent = "1. Nueva Entrada de Blog";
      document.getElementById("btn-save-post").textContent = "Publicar entrada";
      document.getElementById("btn-cancel-post").style.display = "none";
      document.getElementById("post-title").value = "";
      document.getElementById("post-desc").value = "";
      document.getElementById("post-content").value = "";
      document.getElementById("post-img-file").value = "";
      renderCoverPreviews();
      renderInlinePreviews();
    }

    function resetProjForm() {
      editingProjId = null;
      projImageBase64 = "";
      document.getElementById("proj-form-heading").textContent = "2. Nuevo Proyecto (Franja Verde)";
      document.getElementById("btn-save-proj").textContent = "Guardar proyecto";
      document.getElementById("btn-cancel-proj").style.display = "none";
      document.getElementById("proj-title").value = "";
      document.getElementById("proj-desc").value = "";
      document.getElementById("proj-url").value = "";
      document.getElementById("proj-img-file").value = "";
      document.getElementById("proj-img-preview").style.display = "none";
    }

    document.getElementById("btn-cancel-post").addEventListener("click", resetPostForm);
    document.getElementById("btn-cancel-proj").addEventListener("click", resetProjForm);

    // GUARDAR / ACTUALIZAR BLOG
    document.getElementById("btn-save-post").addEventListener("click", async () => {
      const title = document.getElementById("post-title").value.trim();
      const description = document.getElementById("post-desc").value.trim();
      const content = document.getElementById("post-content").value.trim();
      const msg = document.getElementById("post-msg");
      if (!title) return (msg.textContent = "Falta el título de la entrada.");

      const payload = { title, description, content, image: postCoverImages[0] || "", images: postCoverImages, inlineImages: postInlineImages };
      try {
        if (editingPostId) {
          await updateDoc(doc(db, "posts", editingPostId), payload);
          msg.textContent = "Entrada actualizada.";
        } else {
          await addDoc(collection(db, "posts"), { ...payload, createdAt: serverTimestamp() });
          msg.textContent = "Entrada publicada.";
        }
        resetPostForm();
        loadLists();
      } catch (err) {
        msg.textContent = "Error al guardar: " + err.message;
      }
    });

    // GUARDAR / ACTUALIZAR PROYECTO
    document.getElementById("btn-save-proj").addEventListener("click", async () => {
      const title = document.getElementById("proj-title").value.trim();
      const description = document.getElementById("proj-desc").value.trim();
      const url = document.getElementById("proj-url").value.trim();
      const msg = document.getElementById("proj-msg");
      if (!title) return (msg.textContent = "Ponle título al proyecto.");

      if (editingProjId) {
        await updateDoc(doc(db, "projects", editingProjId), { title, description, url, image: projImageBase64 });
        msg.textContent = "Proyecto actualizado.";
      } else {
        await addDoc(collection(db, "projects"), { title, description, url, image: projImageBase64, createdAt: serverTimestamp() });
        msg.textContent = "Proyecto guardado.";
      }
      resetProjForm();
      loadLists();
    });

    // GUARDAR MANIFIESTO
    document.getElementById("btn-save-man").addEventListener("click", async () => {
      await setDoc(doc(db, "settings", "manifesto"), {
        date: document.getElementById("man-date").value.trim(),
        body: document.getElementById("man-body").value,
        signature: document.getElementById("man-sign").value.trim()
      });
      document.getElementById("man-msg").textContent = "Manifiesto actualizado.";
    });

    // GUARDAR SOBRE MÍ
    function parseLines(text, keys) {
      return text.split("\n").map(l => l.trim()).filter(Boolean).map(line => {
        const parts = line.split("|").map(p => p.trim());
        const obj = {};
        keys.forEach((k, i) => obj[k] = parts[i] || "");
        return obj;
      });
    }

    document.getElementById("btn-save-sm").addEventListener("click", async () => {
      const msg = document.getElementById("sm-msg");
      try {
        await setDoc(doc(db, "settings", "sobremi"), {
          nombre: document.getElementById("sm-nombre").value.trim(),
          rol: document.getElementById("sm-rol").value.trim(),
          enlaceDriveCV: document.getElementById("sm-drive").value.trim(),
          fotoPerfil: smFotoPerfil,
          biografia: document.getElementById("sm-bio").value.trim(),
          fotoProyectos: smFotoProyectos,
          formacion: parseLines(document.getElementById("sm-formacion").value, ["etiqueta", "titulo", "institucion", "detalle"]),
          liderazgo: parseLines(document.getElementById("sm-liderazgo").value, ["titulo", "descripcion"]),
          experiencia: parseLines(document.getElementById("sm-experiencia").value, ["puesto", "lugar", "detalle"]),
          certificaciones: parseLines(document.getElementById("sm-certificaciones").value, ["nombre", "emisor"]),
          herramientas: parseLines(document.getElementById("sm-herramientas").value, ["palabra", "detalle"])
        });
        msg.textContent = "Sección Sobre Mí actualizada.";
      } catch (err) {
        msg.textContent = "Error al guardar: " + err.message;
      }
    });

    async function loadLists() {
      const pSnap = await getDocs(query(collection(db, "posts"), orderBy("createdAt", "desc")));
      postsCache = {};
      document.getElementById("posts-list").innerHTML = pSnap.docs.map(d => {
        postsCache[d.id] = d.data();
        return `
          <div class="item-row">
            <span><strong>${d.data().title}</strong></span>
            <div class="item-actions">
              <button class="btn-edit" data-edit-col="posts" data-id="${d.id}">Editar</button>
              <button class="btn-danger" data-del-col="posts" data-id="${d.id}">Borrar</button>
            </div>
          </div>`;
      }).join("");

      const prSnap = await getDocs(query(collection(db, "projects"), orderBy("createdAt", "desc")));
      projsCache = {};
      document.getElementById("projs-list").innerHTML = prSnap.docs.map(d => {
        projsCache[d.id] = d.data();
        return `
          <div class="item-row">
            <span><strong>${d.data().title}</strong></span>
            <div class="item-actions">
              <button class="btn-edit" data-edit-col="projects" data-id="${d.id}">Editar</button>
              <button class="btn-danger" data-del-col="projects" data-id="${d.id}">Borrar</button>
            </div>
          </div>`;
      }).join("");

      document.querySelectorAll("[data-edit-col]").forEach(btn => {
        btn.addEventListener("click", () => {
          const col = btn.dataset.editCol;
          const id = btn.dataset.id;
          if (col === "posts") {
            const p = postsCache[id];
            if (!p) return;
            editingPostId = id;
            postCoverImages = (Array.isArray(p.images) && p.images.length) ? [...p.images] : (p.image ? [p.image] : []);
            postInlineImages = Array.isArray(p.inlineImages) ? [...p.inlineImages] : [];
            document.getElementById("blog-form-heading").textContent = "1. Editando Entrada de Blog";
            document.getElementById("btn-save-post").textContent = "Actualizar entrada";
            document.getElementById("btn-cancel-post").style.display = "inline-block";
            document.getElementById("post-title").value = p.title || "";
            document.getElementById("post-desc").value = p.description || "";
            document.getElementById("post-content").value = p.content || "";
            renderCoverPreviews();
            renderInlinePreviews();
            window.scrollTo({ top: 0, behavior: "smooth" });
          } else {
            const pr = projsCache[id];
            if (!pr) return;
            editingProjId = id;
            projImageBase64 = pr.image || "";
            document.getElementById("proj-form-heading").textContent = "2. Editando Proyecto";
            document.getElementById("btn-save-proj").textContent = "Actualizar proyecto";
            document.getElementById("btn-cancel-proj").style.display = "inline-block";
            document.getElementById("proj-title").value = pr.title || "";
            document.getElementById("proj-desc").value = pr.description || "";
            document.getElementById("proj-url").value = pr.url || "";
            const prev = document.getElementById("proj-img-preview");
            if (projImageBase64) { prev.src = projImageBase64; prev.style.display = "block"; }
            else { prev.style.display = "none"; }
            window.scrollTo({ top: 0, behavior: "smooth" });
          }
        });
      });

      document.querySelectorAll("[data-del-col]").forEach(btn => {
        btn.addEventListener("click", async () => {
          if (!confirm("¿Seguro que quieres borrar esto?")) return;
          await deleteDoc(doc(db, btn.dataset.delCol, btn.dataset.id));
          if (btn.dataset.id === editingPostId) resetPostForm();
          if (btn.dataset.id === editingProjId) resetProjForm();
          loadLists();
        });
      });
    }

    async function loadManifestoAdmin() {
      const snap = await getDoc(doc(db, "settings", "manifesto"));
      if (snap.exists()) {
        const d = snap.data();
        document.getElementById("man-date").value = d.date || "";
        document.getElementById("man-body").value = d.body || "";
        document.getElementById("man-sign").value = d.signature || "";
      }
    }

    async function loadSobreMiAdmin() {
      let sm = { ...defaultSobreMi };
      const snap = await getDoc(doc(db, "settings", "sobremi"));
      if (snap.exists()) sm = { ...defaultSobreMi, ...snap.data() };

      document.getElementById("sm-nombre").value = sm.nombre || "";
      document.getElementById("sm-rol").value = sm.rol || "";
      document.getElementById("sm-drive").value = sm.enlaceDriveCV || "";
      document.getElementById("sm-bio").value = sm.biografia || "";

      smFotoPerfil = sm.fotoPerfil || "";
      if (smFotoPerfil) {
        const p = document.getElementById("sm-foto-perfil-prev");
        p.src = smFotoPerfil; p.style.display = "block";
      }

      smFotoProyectos = sm.fotoProyectos || "";
      if (smFotoProyectos) {
        const p = document.getElementById("sm-foto-proy-prev");
        p.src = smFotoProyectos; p.style.display = "block";
      }

      document.getElementById("sm-formacion").value = (sm.formacion || []).map(f => `${f.etiqueta || ""} | ${f.titulo || ""} | ${f.institucion || ""} | ${f.detalle || ""}`).join("\n");
      document.getElementById("sm-liderazgo").value = (sm.liderazgo || []).map(l => `${l.titulo || ""} | ${l.descripcion || ""}`).join("\n");
      document.getElementById("sm-experiencia").value = (sm.experiencia || []).map(e => `${e.puesto || ""} | ${e.lugar || ""} | ${e.detalle || ""}`).join("\n");
      document.getElementById("sm-certificaciones").value = (sm.certificaciones || []).map(c => `${c.nombre || ""} | ${c.emisor || ""}`).join("\n");
      document.getElementById("sm-herramientas").value = (sm.herramientas || []).map(h => `${h.palabra || ""} | ${h.detalle || ""}`).join("\n");
    }

    function refreshAll() {
      loadLists();
      loadManifestoAdmin();
      loadSobreMiAdmin();
    }
  </script>
</body>
</html>
