<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADMIN // ALEXCTEXEIRA</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .admin-wrap { max-width: 860px; margin: 40px auto; padding: 0 20px 80px; }
    .card { background: #111; border: 1px solid #2c3b1e; border-radius: 14px; padding: 24px; margin-bottom: 28px; }
    .card h2 { font-size: 1.3rem; color: var(--olive-text); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }
    label { display: block; font-family: var(--font-mono); font-size: 0.85rem; color: #bbb; margin: 12px 0 6px; }
    input, textarea { width: 100%; background: #070707; border: 1px solid #333; color: #fff; padding: 10px 12px; border-radius: 8px; font-family: var(--font-display); font-size: 0.95rem; }
    textarea { min-height: 130px; resize: vertical; font-family: var(--font-mono); }
    button { background: var(--olive-mid); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 14px; }
    button:hover { background: #617d44; }
    .btn-danger { background: #7a2222; padding: 6px 12px; font-size: 0.8rem; margin-top: 0; }
    .btn-danger:hover { background: #a12c2c; }
    .item-list { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
    .item-row { display: flex; justify-content: space-between; align-items: center; background: #191919; padding: 10px 14px; border-radius: 8px; gap: 12px; }
    .item-row span { font-size: 0.9rem; }
    .preview-img { max-height: 120px; border-radius: 8px; margin-top: 10px; display: none; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .msg { font-family: var(--font-mono); font-size: 0.85rem; color: #8be08b; margin-top: 10px; }
    .err { color: #ff6b6b; }
  </style>
</head>
<body>

  <div class="admin-wrap">
    <!-- LOGIN -->
    <div id="login-box" class="card">
      <h2>Acceso Restringido // DMA</h2>
      <label>Correo autorizado</label>
      <input type="email" id="login-email" value="contacto@alexctexeira.com.mx" />
      <label>Contraseña</label>
      <input type="password" id="login-pass" placeholder="Tu contraseña" />
      <button id="btn-login">Entrar</button>
      <p id="login-error" class="msg err"></p>
    </div>

    <!-- PANEL ADMIN -->
    <div id="admin-panel" style="display: none;">
      <div class="topbar">
        <h1 style="font-size: 1.5rem;">PANEL // ALEXCTEXEIRA</h1>
        <div>
          <a href="index.html" target="_blank" style="margin-right: 16px; color: var(--olive-text); font-family: var(--font-mono);">Ver sitio ↗</a>
          <button id="btn-logout" class="btn-danger">Salir</button>
        </div>
      </div>

      <!-- 1. BLOG -->
      <section class="card">
        <h2>1. Nueva Entrada de Blog</h2>
        <label>Título</label>
        <input type="text" id="post-title" placeholder="Ej. Mi primer archivo fuera de los muros" />
        <label>Descripción corta (sale en el carrusel)</label>
        <input type="text" id="post-desc" placeholder="Breve resumen..." />
        <label>Imagen de portada (se sube y comprime directo aquí)</label>
        <input type="file" id="post-img-file" accept="image/*" />
        <img id="post-img-preview" class="preview-img" alt="Vista previa" />
        <label>Contenido completo del artículo</label>
        <textarea id="post-content" placeholder="Escribe toda tu entrada aquí..."></textarea>
        <button id="btn-save-post">Publicar entrada</button>
        <p id="post-msg" class="msg"></p>
        <div id="posts-list" class="item-list"></div>
      </section>

      <!-- 2. PROYECTOS -->
      <section class="card">
        <h2>2. Nuevo Proyecto (Franja Verde)</h2>
        <label>Título del proyecto</label>
        <input type="text" id="proj-title" placeholder="Ej. Nombre del proyecto" />
        <label>Descripción corta</label>
        <input type="text" id="proj-desc" placeholder="Qué es este proyecto..." />
        <label>Link del botón "conocer"</label>
        <input type="url" id="proj-url" placeholder="https://..." />
        <label>Imagen del proyecto</label>
        <input type="file" id="proj-img-file" accept="image/*" />
        <img id="proj-img-preview" class="preview-img" alt="Vista previa" />
        <button id="btn-save-proj">Guardar proyecto</button>
        <p id="proj-msg" class="msg"></p>
        <div id="projs-list" class="item-list"></div>
      </section>

      <!-- 3. MANIFIESTO EN PORTUGUÉS -->
      <section class="card">
        <h2>3. Texto en Portugués (Manifiesto)</h2>
        <label>Código / Fecha superior</label>
        <input type="text" id="man-date" placeholder="026 11MOON 27" />
        <label>Texto completo</label>
        <textarea id="man-body" style="min-height: 240px;"></textarea>
        <label>Firma inferior</label>
        <input type="text" id="man-sign" placeholder="— Mantendo a chama acesa." />
        <button id="btn-save-man">Actualizar manifiesto</button>
        <p id="man-msg" class="msg"></p>
      </section>
    </div>
  </div>

  <script type="module">
    import { auth, db, ADMIN_EMAIL } from "./firebase-config.js";
    import { signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { collection, addDoc, getDocs, deleteDoc, doc, setDoc, getDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // Compresor de imágenes directo en el navegador (evita ocupar Firebase Storage)
    function compressImage(file, maxWidth = 1100, quality = 0.78) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement("canvas");
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/webp", quality));
          };
          img.onerror = reject;
        };
        reader.onerror = reject;
      });
    }

    let postImageBase64 = "";
    let projImageBase64 = "";

    document.getElementById("post-img-file").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      postImageBase64 = await compressImage(file, 1200, 0.78);
      const prev = document.getElementById("post-img-preview");
      prev.src = postImageBase64;
      prev.style.display = "block";
    });

    document.getElementById("proj-img-file").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      projImageBase64 = await compressImage(file, 600, 0.8);
      const prev = document.getElementById("proj-img-preview");
      prev.src = projImageBase64;
      prev.style.display = "block";
    });

    // AUTH
    document.getElementById("btn-login").addEventListener("click", async () => {
      const email = document.getElementById("login-email").value.trim();
      const pass = document.getElementById("login-pass").value;
      const errEl = document.getElementById("login-error");
      errEl.textContent = "";

      if (email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()) {
        errEl.textContent = "Acceso denegado: correo no autorizado.";
        return;
      }

      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (err) {
        errEl.textContent = "Credenciales incorrectas.";
      }
    });

    document.getElementById("btn-logout").addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, async (user) => {
      if (user && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
        document.getElementById("login-box").style.display = "none";
        document.getElementById("admin-panel").style.display = "block";
        refreshAll();
      } else {
        if (user) await signOut(auth);
        document.getElementById("login-box").style.display = "block";
        document.getElementById("admin-panel").style.display = "none";
      }
    });

    // GUARDAR BLOG
    document.getElementById("btn-save-post").addEventListener("click", async () => {
      const title = document.getElementById("post-title").value.trim();
      const description = document.getElementById("post-desc").value.trim();
      const content = document.getElementById("post-content").value.trim();
      const msg = document.getElementById("post-msg");
      if (!title) return (msg.textContent = "Ponle título mínimo, wey.");

      await addDoc(collection(db, "posts"), {
        title, description, content,
        image: postImageBase64,
        createdAt: serverTimestamp()
      });

      document.getElementById("post-title").value = "";
      document.getElementById("post-desc").value = "";
      document.getElementById("post-content").value = "";
      document.getElementById("post-img-file").value = "";
      document.getElementById("post-img-preview").style.display = "none";
      postImageBase64 = "";
      msg.textContent = "Entrada publicada.";
      loadLists();
    });

    // GUARDAR PROYECTO
    document.getElementById("btn-save-proj").addEventListener("click", async () => {
      const title = document.getElementById("proj-title").value.trim();
      const description = document.getElementById("proj-desc").value.trim();
      const url = document.getElementById("proj-url").value.trim();
      const msg = document.getElementById("proj-msg");
      if (!title) return (msg.textContent = "Ponle título al proyecto.");

      await addDoc(collection(db, "projects"), {
        title, description, url,
        image: projImageBase64,
        createdAt: serverTimestamp()
      });

      document.getElementById("proj-title").value = "";
      document.getElementById("proj-desc").value = "";
      document.getElementById("proj-url").value = "";
      document.getElementById("proj-img-file").value = "";
      document.getElementById("proj-img-preview").style.display = "none";
      projImageBase64 = "";
      msg.textContent = "Proyecto guardado.";
      loadLists();
    });

    // GUARDAR MANIFIESTO
    document.getElementById("btn-save-man").addEventListener("click", async () => {
      await setDoc(doc(db, "settings", "manifesto"), {
        date: document.getElementById("man-date").value.trim(),
        body: document.getElementById("man-body").value,
        signature: document.getElementById("man-sign").value.trim()
      });
      document.getElementById("man-msg").textContent = "Manifiesto actualizado.";
    });

    async function loadLists() {
      // Posts
      const pSnap = await getDocs(query(collection(db, "posts"), orderBy("createdAt", "desc")));
      const pList = document.getElementById("posts-list");
      pList.innerHTML = pSnap.docs.map(d => `
        <div class="item-row">
          <span><strong>${d.data().title}</strong></span>
          <button class="btn-danger" data-col="posts" data-id="${d.id}">Borrar</button>
        </div>
      `).join("");

      // Proyectos
      const prSnap = await getDocs(query(collection(db, "projects"), orderBy("createdAt", "desc")));
      const prList = document.getElementById("projs-list");
      prList.innerHTML = prSnap.docs.map(d => `
        <div class="item-row">
          <span><strong>${d.data().title}</strong></span>
          <button class="btn-danger" data-col="projects" data-id="${d.id}">Borrar</button>
        </div>
      `).join("");

      document.querySelectorAll("[data-col]").forEach(btn => {
        btn.addEventListener("click", async () => {
          if (!confirm("¿Seguro que quieres borrar esto?")) return;
          await deleteDoc(doc(db, btn.dataset.col, btn.dataset.id));
          loadLists();
        });
      });
    }

    async function loadManifestoAdmin() {
      const snap = await getDoc(doc(db, "settings", "manifesto"));
      if (snap.exists()) {
        const d = snap.data();
        document.getElementById("man-date").value = d.date || "";
        document.getElementById("man-body").value = d.body || "";
        document.getElementById("man-sign").value = d.signature || "";
      }
    }

    function refreshAll() {
      loadLists();
      loadManifestoAdmin();
    }
  </script>
</body>
</html>
